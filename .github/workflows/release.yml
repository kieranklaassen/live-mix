name: Release

# Distribution: GitHub Packages (npm.pkg.github.com), private, scoped
# @kieranklaassen. Publishing authenticates with the workflow's own
# GITHUB_TOKEN (packages: write) — no long-lived secret in this repo.
#
# Every push to main:
# - with pending changesets: publishes a `next` snapshot
#   (0.0.0-next-<timestamp>) so adoption PRs in the apps can pin a build, and
#   opens/updates the "Version Packages" PR (needs the repo setting
#   "Allow GitHub Actions to create and approve pull requests");
# - after that PR merges: publishes the versioned release with the `latest` tag.

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@kieranklaassen'

      - name: Install
        run: pnpm install --frozen-lockfile

      # setup-node writes the registry auth for npm; pnpm publish (what
      # `changeset publish` runs under a pnpm packageManager) reads ~/.npmrc.
      - name: Authenticate pnpm against GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish next snapshot
        if: steps.changesets.outputs.published != 'true' && steps.changesets.outputs.hasChangesets == 'true'
        run: pnpm release:snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
