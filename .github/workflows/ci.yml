name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack and verify exports
        run: pnpm pack:check

  browser:
    name: Real-audio browser golden (Playwright + Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build library and playground
        run: pnpm build && pnpm playground:build

      # Real AudioContext/OfflineAudioContext, worklets and WASM in headless
      # Chromium: offline schedule == mock golden, live capture ≈ offline
      # render, playground mounts.
      - name: Browser tests
        run: pnpm test:browser
        env:
          LIVE_MIX_BROWSER: chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-output
          path: tmp/browser-tests
          if-no-files-found: ignore

  docs:
    name: API reference (TypeDoc) and playground smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # docs/api is generated, never committed (see docs/README.md): the
      # reference for this commit is the workflow artefact below.
      - name: Generate the API reference
        run: pnpm docs:api

      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/api
          retention-days: 30

      # The playground smoke spec (browser-tests/specs/playground.smoke.spec.ts)
      # in the runner's Google Chrome (preinstalled on ubuntu-latest): loads the
      # page, starts real audio from a click, plays, bounces offline, drives the
      # agent console and the grid, and fails on any console error or page
      # exception. The `browser` job runs the same spec under Playwright's
      # Chromium as part of the whole suite.
      - name: Playground smoke test
        run: pnpm playground:smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playground-screenshots
          path: playground/screenshots
          retention-days: 30

  git-fallback:
    name: 'Installs as a github: dependency with npm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Both consumer apps install with npm. A github:#sha dependency clones the
      # repo, runs the nested devDependency install and the prepare script, so
      # this job is the only place that exercises that path before an app does.
      # The repo is public (again, 2026-09-14): no token, so this is exactly the
      # anonymous clone a consumer's CI or Docker build performs.
      - name: Install this commit into a scratch consumer
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          consumer=$(mktemp -d)
          cd "$consumer"
          npm init -y >/dev/null
          npm install "github:kieranklaassen/live-mix#${COMMIT}"
          test -f node_modules/@kieranklaassen/live-mix/dist/index.js
          test -f node_modules/@kieranklaassen/live-mix/dist/wam/index.js
          for wasm in "$GITHUB_WORKSPACE"/src/dsp/wasm/*.wasm; do test -f "node_modules/@kieranklaassen/live-mix/dist/wasm/$(basename "$wasm")"; done
          for worklet in wasm-device ducker meter recorder; do test -f "node_modules/@kieranklaassen/live-mix/dist/worklets/$worklet.js"; done
          node --input-type=module -e "
            import { LIVE_MIX_VERSION } from '@kieranklaassen/live-mix'
            import { DATTORRO_PARAMS, ZITA_REV1_PARAMS, LIMITER_1176_PARAMS } from '@kieranklaassen/live-mix/dsp'
            import { MockAudioContext } from '@kieranklaassen/live-mix/testing'
            console.log('live-mix', LIVE_MIX_VERSION, DATTORRO_PARAMS.mix.id, ZITA_REV1_PARAMS.mix.id, LIMITER_1176_PARAMS.inputGain.id, new MockAudioContext().sampleRate)
          "

  native:
    name: Native C++ device tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run harnesses
        run: bash scripts/test-native.sh

  faust:
    name: Faust sources reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # prettier formats the generated param tables.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache the pinned Faust compiler
        uses: actions/cache@v4
        with:
          # Keep in sync with FAUST_VERSION in scripts/build-faust.sh.
          path: tmp/faust-2.88.0
          key: faust-2.88.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-faust.sh') }}

      - name: Regenerate the C++ and param tables from cpp/faust/*.dsp
        run: bash scripts/build-faust.sh

      - name: Compare against the committed sources
        run: |
          set -euo pipefail
          if git diff --exit-code --stat -- cpp/faust/generated src/dsp/devices/faust; then
            echo "Faust output reproduces"
          else
            echo "::error::cpp/faust/generated or src/dsp/devices/faust differ from what scripts/build-faust.sh produces with Faust 2.88.0. Run it and commit the result."
            exit 1
          fi

  wasm:
    name: WASM artefacts reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          # Keep in sync with EMSDK_VERSION in scripts/build-wasm.sh.
          version: 4.0.15
          actions-cache-folder: emsdk-cache

      - name: Rebuild every device
        run: bash scripts/build-wasm.sh tmp/wasm-rebuild

      - name: Compare against the committed bytes
        run: |
          set -euo pipefail
          status=0
          for committed in src/dsp/wasm/*.wasm; do
            name=$(basename "$committed")
            rebuilt="tmp/wasm-rebuild/$name"
            if [ ! -f "$rebuilt" ]; then
              echo "::error::$name is committed but scripts/build-wasm.sh did not produce it"
              status=1
              continue
            fi
            if cmp -s "$committed" "$rebuilt"; then
              echo "$name reproduces ($(sha256sum "$committed" | cut -c1-16))"
            else
              echo "::error::$name differs from the committed artefact. Run scripts/build-wasm.sh with emsdk 4.0.15 and commit the result."
              sha256sum "$committed" "$rebuilt"
              status=1
            fi
          done
          exit $status
